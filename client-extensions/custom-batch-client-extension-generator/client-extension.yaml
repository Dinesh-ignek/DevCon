assemble:
    - fromTask: bootJar

custom-batch-client-extension-generator-etc-spring-boot-oauth-application-user-agent:
    .serviceAddress: localhost:58081
    .serviceScheme: http
    name: Custom Batch Client Extension Generator Etc Spring Boot OAuth Application User Agent
    scopes:
        - Liferay.Headless.Admin.User.everything
        - Liferay.Headless.Admin.List.Type.everything
        - Liferay.Object.Admin.REST.everything
        - c_clientextension.everything
    type: oAuthApplicationUserAgent
custom-batch-client-extension-generator-etc-spring-boot-object-action:
    name: Custom Batch Client Extension Generator Etc Spring Boot Object Action 
    oAuth2ApplicationExternalReferenceCode: custom-batch-client-extension-generator-etc-spring-boot-oauth-application-user-agent
    resourcePath: /object/action
    type: objectAction

